[project]
name = "mentor-ai-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
# Optional transformer phase (guide §22): CUDA 13 build of PyTorch for the RTX 3050.
transformer = ["torch>=2.13", "transformers>=4.50"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
